<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fantasía en Europa</title>
<meta name="theme-color" content="#0A7AFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Europa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>html,body{margin:0;padding:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>

<style>
/* Layout: estilo Apple Maps. Mapa a pantalla completa; en escritorio, panel flotante de vidrio a la izquierda; en móvil, hoja inferior que se arrastra. Color solo por categoría. */
:root{
  --bg:#F2F2F7; --sheet:rgba(246,246,249,.86); --card:#FFFFFF; --cardhi:#FFFFFF;
  --label:#000000; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.32); --sep:rgba(60,60,67,.16); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  --blue:#007AFF; --green:#34C759; --red:#FF3B30; --indigo:#5856D6;
  --c-m:#FF2D55; --c-g:#AF52DE; --c-f:#FF9500; --c-o:#0A7AFF; --c-h:#5856D6;
  --water:#AED6F3; --land:#F3F1EB; --landr:#FAF9F5; --border:#D6D0C3; --urban:#E9E5DB; --river:#9CCCEE; --halo:#FFFFFF; --route:#0A7AFF;
  --shadow:0 12px 40px rgba(0,0,0,.16),0 1px 3px rgba(0,0,0,.08);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --fd:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
  --fr:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --sheet:rgba(30,30,32,.84); --card:#2C2C2E; --cardhi:#3A3A3C;
  --label:#FFFFFF; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.55); --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.36);
  --blue:#0A84FF; --green:#30D158; --red:#FF453A; --indigo:#5E5CE6;
  --c-m:#FF375F; --c-g:#BF5AF2; --c-f:#FF9F0A; --c-o:#0A84FF; --c-h:#7D7AFF;
  --water:#12263A; --land:#232326; --landr:#2B2B2E; --border:#3E3E42; --urban:#323236; --river:#1D3B57; --halo:#1C1C1E; --route:#0A84FF;
  --shadow:0 12px 40px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --sheet:rgba(30,30,32,.84); --card:#2C2C2E; --cardhi:#3A3A3C;
  --label:#FFFFFF; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.55); --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.36);
  --blue:#0A84FF; --green:#30D158; --red:#FF453A; --indigo:#5E5CE6;
  --c-m:#FF375F; --c-g:#BF5AF2; --c-f:#FF9F0A; --c-o:#0A84FF; --c-h:#7D7AFF;
  --water:#12263A; --land:#232326; --landr:#2B2B2E; --border:#3E3E42; --urban:#323236; --river:#1D3B57; --halo:#1C1C1E; --route:#0A84FF;
  --shadow:0 12px 40px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--water);color:var(--label);font-family:var(--f);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden;letter-spacing:-.01em}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
a{color:var(--blue);text-decoration:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.app{position:relative;height:100%;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;background:var(--water)}

/* glass */
.glass{background:var(--sheet);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);box-shadow:var(--shadow)}

/* panel */
.panel{position:absolute;top:16px;left:max(16px, env(safe-area-inset-left,0px));bottom:16px;width:392px;border-radius:22px;display:flex;flex-direction:column;overflow:hidden;z-index:5}
.grab{display:none}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:6px 16px 28px;scrollbar-width:thin}
.navbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px 4px;min-height:44px}
.back{border:0;background:none;color:var(--blue);font-size:16px;cursor:pointer;padding:4px 0;display:flex;align-items:center;gap:2px}
.back svg{width:20px;height:20px}
.navtitle{font-weight:600;font-size:15px;opacity:0;transition:opacity .2s}
.xbtn{width:30px;height:30px;border-radius:50%;border:0;background:var(--fill);color:var(--label2);cursor:pointer;display:grid;place-items:center}
.xbtn svg{width:14px;height:14px}

@media (max-width:760px){
  .panel{top:auto;left:0;right:0;bottom:0;width:auto;height:94dvh;border-radius:16px 16px 0 0;transform:translateY(var(--sy,55dvh));transition:transform .38s cubic-bezier(.2,.85,.25,1);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .panel.drag{transition:none}
  .grab{display:block;padding:8px 0 2px;cursor:grab;touch-action:none}
  .grab i{display:block;width:38px;height:5px;border-radius:3px;background:var(--label3);margin:0 auto}
  .navbar{padding-top:2px;touch-action:none}
  .scroll{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
}

/* map chrome */
.cats{position:absolute;top:16px;left:calc(16px + 392px + 14px);right:70px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;z-index:4;padding:2px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;display:flex;align-items:center;gap:7px;border:0;border-radius:999px;padding:8px 14px 8px 9px;font-size:14px;font-weight:600;cursor:pointer;color:var(--label)}
.cat .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff}
.cat .dot svg{width:13px;height:13px}
.cat[aria-pressed="true"]{background:var(--label);color:var(--card)}
.cat[aria-pressed="true"] .dot{box-shadow:0 0 0 2px var(--card)}
.ctl{position:absolute;right:max(16px, env(safe-area-inset-right,0px));top:16px;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;z-index:4}
.ctl button{width:44px;height:44px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--label)}
.ctl button+button{border-top:.5px solid var(--sep)}
.ctl svg{width:18px;height:18px}
.scale{position:absolute;right:max(16px, env(safe-area-inset-right,0px));bottom:16px;font-size:11px;color:var(--label2);font-weight:600;z-index:3;text-align:right;padding:4px 8px;border-radius:8px}
.scale .bar{height:5px;border:1.5px solid var(--label2);border-top:0;margin:0 0 3px auto}
@media (max-width:760px){
  .cats{top:max(10px, env(safe-area-inset-top,0px));left:10px;right:62px}
  .ctl{top:max(10px, env(safe-area-inset-top,0px));right:10px}
  .ctl button{width:42px;height:42px}
  .scale{display:none}
}

/* map layers */
.c-land{fill:var(--land);stroke:var(--border);stroke-width:.8;vector-effect:non-scaling-stroke}
.c-land.r{fill:var(--landr)}
.rv{fill:none;stroke:var(--river);stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-linecap:round}
.rvd{fill:none;stroke:var(--river);stroke-width:5;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.lk{fill:var(--water);stroke:none}
.urb{fill:var(--urban)}
.rt-case{fill:none;stroke:var(--halo);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.rt{fill:none;stroke:var(--route);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.85}
.rt.dim{opacity:.28}
.rt-act{fill:none;stroke:var(--route);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.walkln{fill:none;stroke:var(--blue);stroke-width:3;stroke-dasharray:1 7;stroke-linecap:round;vector-effect:non-scaling-stroke}
.node{cursor:pointer}
.node .ring{fill:var(--halo);stroke:var(--route);stroke-width:3}
.node.stop .ring{stroke:var(--label3);stroke-width:2}
.node text{font-family:var(--fd);font-weight:700;font-size:14px;fill:var(--label);paint-order:stroke;stroke:var(--halo);stroke-width:4px;stroke-linejoin:round;letter-spacing:-.01em}
.node.stop text{font-weight:500;font-size:12px;fill:var(--label2)}
.node.on .ring{fill:var(--route);stroke:var(--halo)}
.area{font-family:var(--f);font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;fill:var(--label3);text-anchor:middle;pointer-events:none}
.pin{cursor:pointer;transition:opacity .2s}
.pin .bg{stroke:var(--halo);stroke-width:2.5;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.pin.m .bg{fill:var(--c-m)} .pin.g .bg{fill:var(--c-g)} .pin.f .bg{fill:var(--c-f)} .pin.o .bg{fill:var(--c-o)} .pin.h .bg{fill:var(--c-h)}
.pin .gl{color:#fff}
.pin text{font-family:var(--f);font-weight:600;font-size:12.5px;fill:var(--label);paint-order:stroke;stroke:var(--halo);stroke-width:3.5px;stroke-linejoin:round;opacity:0;pointer-events:none}
.pin.lbl text,.pin.sel text{opacity:1}
.pin.sel .bg{stroke-width:3.5}
.pin.sel .sc{transform:scale(1.35)}
.pin.dim{opacity:.0;pointer-events:none}

/* type */
.lt{font-family:var(--fd);font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.08;margin:2px 0 4px;text-wrap:balance}
.sub{color:var(--label2);font-size:15px;margin:0}
.h2{font-family:var(--fd);font-size:20px;font-weight:700;letter-spacing:-.02em;margin:24px 2px 8px;display:flex;justify-content:space-between;align-items:baseline}
.h2 small{font-family:var(--f);font-size:13px;font-weight:400;color:var(--label2);letter-spacing:0}
.foot{font-size:11.5px;color:var(--label3);margin:26px 2px 0;line-height:1.45}
.num{font-family:var(--fr);font-variant-numeric:tabular-nums}

/* groups & rows */
.group{background:var(--card);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;border:0;background:transparent;text-align:left;cursor:pointer;position:relative;min-height:52px}
.row+.row::before{content:"";position:absolute;top:0;left:56px;right:0;border-top:.5px solid var(--sep)}
.row.noic+.row.noic::before,.row.noic+.row::before{left:14px}
.row:active{background:var(--fill)}
.row .ic{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff}
.row .ic svg{width:16px;height:16px}
.row .ic.sq{border-radius:8px}
.row .tx{flex:1;min-width:0}
.row .t{font-size:15.5px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--label2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s.wrap{white-space:normal}
.row .chev{flex:none;color:var(--label3);width:14px;height:14px}
.row .rv2{flex:none;font-size:13px;color:var(--label2);text-align:right}
.cal{flex:none;width:40px;text-align:center;line-height:1}
.cal small{display:block;font-size:10px;font-weight:700;color:var(--red);letter-spacing:.04em}
.cal b{display:block;font-family:var(--fd);font-size:22px;font-weight:600;margin-top:2px}

/* search */
.search{display:flex;align-items:center;gap:7px;background:var(--fill);border-radius:11px;padding:0 10px;margin:10px 0 2px}
.search svg{width:16px;height:16px;color:var(--label2);flex:none}
.search input{flex:1;border:0;background:none;font:inherit;font-size:16px;color:var(--label);padding:9px 0;outline:none;min-width:0}
.search input::placeholder{color:var(--label2)}

/* hero today */
.today{margin-top:14px;border-radius:20px;padding:16px 16px 15px;color:#fff;background:linear-gradient(135deg,#0A7AFF 0%,#5856D6 100%);cursor:pointer;border:0;text-align:left;width:100%;display:block;box-shadow:0 8px 24px rgba(10,122,255,.25)}
.today .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.today .t{font-family:var(--fd);font-size:22px;font-weight:700;letter-spacing:-.02em;margin:4px 0 2px;line-height:1.15}
.today .s{font-size:14px;opacity:.92}
.today .big{font-family:var(--fr);font-size:44px;font-weight:700;line-height:1;margin:6px 0 2px}

/* segmented */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;margin-top:12px}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:6px 4px;font-size:13px;font-weight:600;cursor:pointer;color:var(--label);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--cardhi);box-shadow:0 1px 4px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--fill);color:var(--label2)}
.chip.b{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.chip.r{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.chip.g{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}

/* day strip */
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:12px -16px 0;padding:2px 16px 4px;scroll-snap-type:x mandatory}
.days::-webkit-scrollbar{display:none}
.dcard{flex:none;width:250px;scroll-snap-align:start;background:var(--card);border-radius:14px;padding:12px 14px;border:0;text-align:left;cursor:pointer;box-shadow:inset 0 0 0 1.5px transparent}
.dcard.cur{box-shadow:inset 0 0 0 2px var(--blue)}
.dcard .k{font-size:12px;color:var(--label2);font-weight:600;display:flex;justify-content:space-between}
.dcard .k .bus{color:var(--blue)}
.dcard .k .ext{color:var(--red)}
.dcard .t{font-family:var(--fd);font-weight:700;font-size:17px;margin:3px 0 4px;letter-spacing:-.01em}
.dcard p{margin:0;font-size:13px;color:var(--label2);line-height:1.4}

/* place */
.phead{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-top:4px}
.phead .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff}
.phead .ic svg{width:13px;height:13px}
.pdesc{font-size:15.5px;line-height:1.5;margin:12px 0 0}
.facts{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:14px;margin-top:14px}
.facts div{padding:10px 12px;min-width:0}
.facts div+div{border-left:.5px solid var(--sep)}
.facts small{display:block;font-size:11px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.04em}
.facts b{display:block;font-size:14px;font-weight:600;margin-top:2px;overflow-wrap:anywhere}
.go{background:var(--card);border-radius:14px;padding:14px;margin-top:10px}
.go .from{font-size:13px;color:var(--label2);margin-bottom:8px}
.go .main{display:flex;gap:12px;align-items:center;margin-top:12px}
.go .mic{flex:none;width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue);display:grid;place-items:center}
.go .mic svg{width:24px;height:24px}
.go .mt{font-family:var(--fd);font-size:19px;font-weight:700;letter-spacing:-.01em}
.go .ms{font-size:13px;color:var(--label2);margin-top:1px}
.go .tip{font-size:13.5px;margin:12px 0 0;padding-top:12px;border-top:.5px solid var(--sep);line-height:1.45}
.go .tip b{font-weight:600}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 10px;font-size:15px;font-weight:600;cursor:pointer;text-align:center}
.btn.p{background:var(--blue);color:#fff}
.btn.s{background:color-mix(in srgb,var(--blue) 13%,transparent);color:var(--blue)}
.btn svg{width:16px;height:16px}
.steps{list-style:none;margin:14px 0 0;padding:12px 0 0;border-top:.5px solid var(--sep);position:relative}
.steps li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;padding:5px 0;position:relative;font-size:14px;line-height:1.4}
.steps li:not(:last-child)::after{content:"";position:absolute;left:14px;top:30px;bottom:-6px;border-left:2px dotted var(--label3)}
.steps .sb{width:28px;height:24px;border-radius:7px;display:grid;place-items:center;font-family:var(--fr);font-weight:800;font-size:12.5px;color:#fff;background:var(--label2)}
.steps .sb.ico{background:var(--fill2);color:var(--label)}
.steps .sb svg{width:15px;height:15px}
.steps .tt{padding-top:2px}
.steps .tt small{display:block;color:var(--label2);font-size:12.5px}
.lb{display:inline-grid;place-items:center;min-width:19px;height:17px;padding:0 4px;border-radius:5px;font-family:var(--fr);font-weight:800;font-size:10.5px;color:#fff;vertical-align:1px;margin-right:2px}
.note{font-size:12px;color:var(--label2);margin:8px 2px 0}

/* lists inside cards */
.card{background:var(--card);border-radius:14px;padding:13px 14px;margin-top:8px}
.card b.t{display:block;font-size:15px;font-weight:600;margin-bottom:3px}
.card p{margin:0;font-size:14px;color:var(--label2);line-height:1.45}
.card.warn{box-shadow:inset 3px 0 0 var(--red)}
.ul{margin:0;padding:0;list-style:none}
.ul li{font-size:14px;line-height:1.45;padding:9px 0;border-top:.5px solid var(--sep)}
.ul li:first-child{border-top:0;padding-top:2px}
.ul li b{font-weight:600}
.chk label{display:flex;gap:12px;align-items:flex-start;padding:10px 0;font-size:14.5px;cursor:pointer;border-top:.5px solid var(--sep);line-height:1.4}
.chk label:first-child{border-top:0}
.chk input{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--label3);margin:0;display:grid;place-items:center;cursor:pointer}
.chk input:checked{background:var(--blue);border-color:var(--blue)}
.chk input:checked::after{content:"";width:6px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk input:checked+span{color:var(--label2);text-decoration:line-through}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--card);border:0;border-radius:16px;padding:13px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:22px;min-height:96px}
.tile .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff}
.tile .ic svg{width:16px;height:16px}
.tile b{font-size:15px;font-weight:600;display:block}
.tile span{font-size:12.5px;color:var(--label2)}
.disc{background:var(--card);border-radius:14px;margin-top:8px}
.disc summary{list-style:none;padding:13px 14px;font-weight:600;font-size:15px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.disc summary::-webkit-details-marker{display:none}
.disc summary svg{width:14px;height:14px;color:var(--label3);transition:transform .2s}
.disc[open] summary svg{transform:rotate(90deg)}
.disc .bd{padding:0 14px 12px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;font-size:14px;margin:0}
.kv dt{color:var(--label2)} .kv dd{margin:0}
.social{display:flex;flex-wrap:wrap;gap:6px}
.social a{font-size:13px;font-weight:600;background:var(--fill);color:var(--label);padding:7px 12px;border-radius:999px}
.empty{color:var(--label2);font-size:14px;padding:14px;text-align:center}
.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.panel{transition:none}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

function plan(fromId,p){
  const k=p.city,tr=p.tr||{},a=PIN(fromId).ll,d=hav(a,p.ll);
  if(d<=1.3&&p.t!=='o')return[["walk","",`${Math.max(2,Math.round(d*16))} min a pie desde el hotel`]];
  if(tr.steps)return tr.steps;
  if(tr.anchor){const an=PIN(tr.anchor);const w=Math.max(2,Math.round(hav(an.ll,p.ll)*16));return[["taxi","","Taxi hasta el Duomo (≈ 15 a 20 min). El viernes 20 hay huelga de transporte"]].concat(p.id===tr.anchor?[]:[["walk","",`${w} min a pie desde el Duomo`]])}
  const H=(PIN(fromId).tr)||null;if(!H||!tr.st)return null;
  const steps=[];if(H.w)steps.push(["walk","",`${H.w} min a pie hasta la estación ${H.st}`]);
  const dir=l=>{const x=(DIRS[fromId]||{})[l];if(fromId==='h-chamartin'&&l==='10'&&p.id==='md-ssreyes')return' (dirección Hospital Infanta Sofía)';return x?` (dirección ${x})`:''};
  const common=H.l.find(l=>tr.l.includes(l));
  if(H.st===tr.st){}
  else if(common)steps.push(["metro",common,`Línea ${common} desde ${H.st} hasta ${tr.st}${dir(common)}`]);
  else{let found=null;for(const x of H.l)for(const y of tr.l){const key=[x,y].sort((m,n)=>(+m||0)-(+n||0)||m.localeCompare(n)).join('-');const t=(XF[k]||{})[key]||(XF[k]||{})[[x,y].join('-')]||(XF[k]||{})[[y,x].join('-')];if(t&&!found)found=[x,y,t]}
    if(!found)return null;
    steps.push(["metro",found[0],`Línea ${found[0]} desde ${H.st} hasta ${found[2]}${dir(found[0])}`]);
    steps.push(["metro",found[1],`Cambia a la línea ${found[1]} hasta ${tr.st}`]);}
  if(tr.x)steps.push(["bus","",tr.x]);
  if(tr.w)steps.push(["walk","",`${tr.w} min a pie hasta el lugar`]);
  return steps;
}
function badge(k,st){const [t,b]=st;if(b)return `<span class="sb" style="background:${lcol(k,b)}">${esc(b)}</span>`;const icn={walk:'walk',taxi:'car',bus:'tram',boat:'boat',train:'tram',tram:'tram',metro:'tram'}[t]||'tram';return `<span class="sb ico">${ic(icn)}</span>`}
function stepsHtml(k,steps){return `<ol class="steps">${steps.map(st=>`<li>${badge(k,st)}<div class="tt">${esc(st[2])}${st[1]?`<small>${KIND[st[0]]||''} ${esc(st[1])}</small>`:''}</div></li>`).join('')}</ol>`}
function lineSummary(k,steps){if(!steps)return'';const b=steps.filter(s=>s[1]);if(!b.length)return steps[0][0]==='walk'?'':KIND[steps[0][0]];return b.map(s=>`<span class="lb" style="background:${lcol(k,s[1])}">${esc(s[1])}</span>`).join('')}

function search(){
  const q=st.q.trim().toLowerCase(),out=$('#results'),body=$('#homebody');
  if(!q){out.innerHTML='';body.hidden=false;return}
  const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');const nq=norm(q);
  const hits=PINS.filter(p=>norm(p.n+' '+p.d+' '+C[p.city].name+' '+CAT[p.t].n).includes(nq)).slice(0,30);
  body.hidden=true;
  out.innerHTML=hits.length?`<div class="h2">${hits.length} resultados</div><div class="group">${hits.map(p=>`<button class="row" data-id="${p.id}"><span class="ic" style="background:${catColor(p.t)}">${ic(CAT[p.t].i)}</span><span class="tx"><div class="t">${esc(p.n)}</div><div class="s">${C[p.city].name} · ${CAT[p.t].one}</div></span>${ic('chev','chev')}</button>`).join('')}</div>`:`<p class="empty">Nada con “${esc(st.q)}”. Prueba con “gelato”, “cuero” o “Louvre”.</p>`;
  bindRows(out);
}

setSheet('half');
const h=(location.hash||'').slice(1);
if(h.startsWith('p-')&&PIN(h.slice(2))){openPlace(h.slice(2))}
else if(C[h]){openCity(h)}
else if(h==='comida'){openGuide('food')}
else if(h==='compras'){openGuide('shop')}
else if(h==='info'){openGuide('info')}
else{fitBox(routeBox(),0);render()}
addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(C[k]&&k!==st.city)openCity(k)});
</script>

<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
</body>
